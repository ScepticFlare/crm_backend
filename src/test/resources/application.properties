# Test-only datasource. Overrides src/main/resources/application.properties
# on the test classpath so `mvn test` never needs the real Postgres instance
# (SPRING_DATASOURCE_URL etc. aren't set in most dev/CI environments).
# Hibernate builds the schema fresh from the entities for each test run;
# Flyway is disabled here since H2's SQL dialect isn't guaranteed to match
# the Postgres-specific migration in db/migration - that migration should
# still be verified against a real Postgres instance before deploying.
spring.datasource.url=jdbc:h2:mem:crm_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

jwt.secret=6b7f8f3c7d0b0b5d7c8f9a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d

# This file replaces (not merges with) the main application.properties on
# the test classpath. Email is configured here so the suite exercises the
# configured paths - no real Brevo API call is ever made from the test suite
# (every test that sends mocks BrevoEmailClient). The unconfigured case is
# covered by OptionalIntegrationsUnconfiguredTest, which blanks these.
brevo.api-key=test-key
crm.mail.from-address=test@example.com
crm.mail.from-name=Compact Systems
crm.documents.storage-path=target/test-documents

# TEMPORARY - forces off the BrevoEmailClient startup diagnostic (see
# application.properties) for @SpringBootTest contexts, which do construct
# a real BrevoEmailClient bean (even though they never call send()) - without
# this override, @PostConstruct would make a real network call during
# `mvn test`. Remove alongside the corresponding main property/code.
crm.debug.brevo-account-check-on-startup=false

# Same reason as above - the real application.properties resolves this via
# ${CORS_ALLOWED_ORIGINS:...} with an inline default, but this file replaces
# rather than merges with the main one on the test classpath, so the key
# needs a literal value here too. No test actually asserts on CORS behavior;
# this only needs to be resolvable so the SecurityConfig bean can be created.
crm.cors.allowed-origins=http://localhost:5173,http://localhost:5174

# The public lead form's assignee. Tests that submit public leads create an
# Employee with this address; unset, submissions are refused (503) - see
# OptionalIntegrationsUnconfiguredTest.
crm.public-lead.assignee-email=test-admin@example.com
