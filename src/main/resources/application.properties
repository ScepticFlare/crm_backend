spring.application.name=crm

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway manages schema changes going forward (see db/migration). Existing
# environments already have a schema produced by ddl-auto=update above, so
# Flyway is baselined at version 1 (treat whatever's already there as the
# starting point) rather than trying to recreate it - only new, additive
# migrations run from V2 onward. ddl-auto stays "update" for every
# pre-existing table; Flyway migrations create the new tables/columns those
# don't already know about, so nothing here changes behavior for the
# schema that existed before this migration.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

server.port=${PORT:8080}

# Frontend origins allowed to call this API (CORS) - see
# config.SecurityConfig.corsConfigurationSource. Comma-separated. The inline
# default preserves exactly the origins already allowed before this became
# configurable (local dev on 5173/5174 + the existing deployed frontend);
# override with CORS_ALLOWED_ORIGINS on Render once the production
# frontend's real URL is known, without needing a code change/redeploy.
crm.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,https://crm-frontend-q5nk.onrender.com}

# JWT signing key. Defaults to the value already in use today so existing
# behavior/tokens are unaffected; set JWT_SECRET on Render to override it
# without keeping the secret in source.
jwt.secret=${JWT_SECRET:6b7f8f3c7d0b0b5d7c8f9a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d}

# Stale-lead detection (READ-ONLY - see service.StaleLeadRules): a Lead still in
# an open status (NEW/CONTACTED/QUOTATION_SENT/NEGOTIATION), not edited and with
# no follow-up for this many months, and without an Opportunity, is FLAGGED as
# stale on the Inactive Leads page. Nothing is changed in the database - no
# status is written (the old scheduled job that wrote INACTIVE was removed).
# The cutoff is "now" in the business timezone (util.BusinessClock) minus this.
crm.lead.stale-after-months=${LEAD_STALE_AFTER_MONTHS:6}

# Outbound email - every CRM email (individual Lead email, Keep in Touch bulk,
# and Bulk Email for Leads/Opportunities) is sent FROM THE SIGNED-IN EMPLOYEE'S
# OWN mailbox: Gmail / Google Workspace through the Gmail API, or Outlook /
# Microsoft 365 through Microsoft Graph (see service.mail.MailboxSender). Each
# employee connects their mailbox once under "Email Account". This replaced the
# shared Brevo account; nothing is sent through Brevo any more, and there is no
# fallback to a shared or another employee's mailbox.
# Setup (Google Cloud / Microsoft Entra) and the Render variables:
# docs/email-provider-migration.md.
#
# Optional for STARTUP, like the other integrations: without these the CRM
# starts normally, and connecting a mailbox / sending email is refused with 503.
# No defaults for secrets on purpose.
#
# EMAIL_TOKEN_ENCRYPTION_KEY: 32 random bytes, base64 (e.g. `openssl rand
# -base64 32`). Encrypts the stored refresh tokens (AES-256-GCM). Losing or
# changing it means every employee must reconnect; to rotate without that, move
# the old value to EMAIL_TOKEN_ENCRYPTION_KEY_PREVIOUS.
crm.mail.token-encryption-key=${EMAIL_TOKEN_ENCRYPTION_KEY:}
crm.mail.token-encryption-key-previous=${EMAIL_TOKEN_ENCRYPTION_KEY_PREVIOUS:}

# Google OAuth web client (scopes: openid, email, gmail.send). The redirect URI
# must be registered exactly in Google Cloud, e.g.
# https://<backend>.onrender.com/api/email-accounts/oauth/google/callback
crm.mail.google.client-id=${GOOGLE_CLIENT_ID:}
crm.mail.google.client-secret=${GOOGLE_CLIENT_SECRET:}
crm.mail.google.redirect-uri=${GOOGLE_REDIRECT_URI:}

# Microsoft Entra app registration (delegated: Mail.Send, User.Read,
# offline_access, openid). MICROSOFT_TENANT_ID: the company tenant id
# (recommended), "organizations" (any work/school account) or "common" (also
# personal Outlook.com accounts). Redirect URI e.g.
# https://<backend>.onrender.com/api/email-accounts/oauth/microsoft/callback
crm.mail.microsoft.client-id=${MICROSOFT_CLIENT_ID:}
crm.mail.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:}
crm.mail.microsoft.tenant-id=${MICROSOFT_TENANT_ID:common}
crm.mail.microsoft.redirect-uri=${MICROSOFT_REDIRECT_URI:}

# The CRM page the browser returns to after connecting (frontend URL + /email-account).
crm.mail.oauth.return-url=${EMAIL_OAUTH_RETURN_URL:http://localhost:5173/email-account}

# A mailbox can only be connected when its address equals the employee's CRM
# login email. Keep true unless employees log in with a different address than
# their mailbox - see the doc for what turning it off allows.
crm.mail.mailbox.require-employee-email-match=${EMAIL_REQUIRE_EMPLOYEE_EMAIL_MATCH:true}

# Pacing and the daily cap per mailbox - deliberately BELOW the providers' own
# limits (Gmail: ~500/day consumer, 2,000/day Workspace; Exchange Online: 30
# messages/minute, 10,000 recipients/day). Lower them if your accounts have
# lower limits; never raise them above the provider's.
crm.mail.google.per-minute=${EMAIL_GOOGLE_PER_MINUTE:60}
crm.mail.google.min-interval-ms=${EMAIL_GOOGLE_MIN_INTERVAL_MS:500}
crm.mail.google.daily-limit=${EMAIL_GOOGLE_DAILY_LIMIT:400}
crm.mail.microsoft.per-minute=${EMAIL_MICROSOFT_PER_MINUTE:30}
crm.mail.microsoft.min-interval-ms=${EMAIL_MICROSOFT_MIN_INTERVAL_MS:0}
crm.mail.microsoft.daily-limit=${EMAIL_MICROSOFT_DAILY_LIMIT:2000}

# Storage backend for uploaded documents (product brochures, company
# profile, etc - see service.DocumentStorageService). "local" (default)
# writes to local disk - fine for local dev, but Render's filesystem is
# ephemeral (wiped on redeploy/restart/spin-down/new instance), so
# production must set DOCUMENT_STORAGE_BACKEND=supabase to persist files in
# Supabase Storage instead. DocumentService/LeadEmailService/DocumentController
# never know which backend is active - only LocalDiskDocumentStorageService
# and SupabaseStorageDocumentStorageService do, gated by this property via
# @ConditionalOnProperty.
crm.documents.storage-backend=${DOCUMENT_STORAGE_BACKEND:local}

# Local-disk storage path - only used when crm.documents.storage-backend=local.
crm.documents.storage-path=${DOCUMENT_STORAGE_PATH:./uploads/documents}

# Supabase Storage - only used when crm.documents.storage-backend=supabase.
# No defaults on purpose (same reasoning as the mail credentials above):
# startup should fail loudly if these are unset in an environment that
# actually needs them, rather than silently misconfigure the client.
# SUPABASE_SERVICE_ROLE_KEY is a backend-only secret - it must never be
# shipped to the React frontend; all Storage access goes through this
# backend's /api/documents endpoints.
crm.documents.supabase.url=${SUPABASE_URL}
crm.documents.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
crm.documents.supabase.bucket=${SUPABASE_STORAGE_BUCKET:documents}

# Public lead enquiry form (POST /api/public/leads - see
# controller.PublicLeadController / service.PublicLeadService). Every public
# submission is assigned to the Employee with this email address ("Test
# Admin" today) rather than a hard-coded employee id, so the assignee can be
# changed per-environment without a code change. Optional for STARTUP: when
# unset (e.g. local development) the CRM starts, logs "Public lead form is
# DISABLED", and refuses every public submission with HTTP 503 - no lead is
# created, unassigned or misassigned. The same 503 is returned when it names
# no existing employee. Production (where the public form is live) must set
# it to the intake employee's address.
crm.public-lead.assignee-email=${PUBLIC_LEAD_ASSIGNEE_EMAIL:}

# Basic per-IP abuse throttling on the same endpoint (see
# security.PublicLeadRateLimiter) - max requests allowed per IP within the
# rolling window below.
crm.public-lead.rate-limit.max-requests=${PUBLIC_LEAD_RATE_LIMIT_MAX:5}
crm.public-lead.rate-limit.window-seconds=${PUBLIC_LEAD_RATE_LIMIT_WINDOW_SECONDS:60}

# Bulk WhatsApp via a self-hosted WAHA (WhatsApp HTTP API) instance - see
# docs/BULK_WHATSAPP.md and service.WahaWhatsAppClient. Optional integration:
# with WAHA_BASE_URL or WAHA_API_KEY unset (or WHATSAPP_ENABLED=false) the CRM
# starts normally, logs "WhatsApp sending is DISABLED", and every WhatsApp send
# is refused with HTTP 503 - nothing is attempted. Bulk Email is unaffected.
#   WAHA_BASE_URL          e.g. http://waha:3000 (reachable from this backend only)
#   WAHA_API_KEY           the PLAIN key; the WAHA container itself is given its
#                          sha512 hash (WAHA_API_KEY=sha512:...) - never commit either
#   WAHA_SESSION           WAHA session name (default "default")
#   WAHA_WEBHOOK_HMAC_KEY  same value as WAHA's WHATSAPP_HOOK_HMAC_KEY; webhooks
#                          are rejected while it is unset
crm.whatsapp.enabled=${WHATSAPP_ENABLED:true}
crm.whatsapp.waha.base-url=${WAHA_BASE_URL:}
crm.whatsapp.waha.api-key=${WAHA_API_KEY:}
crm.whatsapp.waha.session=${WAHA_SESSION:default}
crm.whatsapp.waha.webhook-hmac-key=${WAHA_WEBHOOK_HMAC_KEY:}
crm.whatsapp.default-country-code=${WHATSAPP_DEFAULT_COUNTRY_CODE:91}
# Conservative defaults: small chunks, a fixed pause between sends, and a
# 24-hour "recently messaged" window (scope: the same number or record, across
# batches; consent and opt-out are independent of it).
crm.whatsapp.bulk.max-recipients=${WHATSAPP_BULK_MAX_RECIPIENTS:100}
crm.whatsapp.bulk.max-chunk=${WHATSAPP_BULK_MAX_CHUNK:5}
crm.whatsapp.bulk.min-interval-ms=${WHATSAPP_BULK_MIN_INTERVAL_MS:1500}
crm.whatsapp.bulk.dedupe-hours=${WHATSAPP_BULK_DEDUPE_HOURS:24}
